<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Telestrator — Editor</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    #editorViewport { background: transparent; overflow: hidden; }
    #imageLayer, #textLayer { position:absolute; left:0; top:0; pointer-events:none; }
    #editorCanvas { position:absolute; left:0; top:0; }
    .top-controls { display:flex; align-items:center; gap:8px; margin-left:auto; }
    .top-controls input[type=range] { width:100px; }
    .lib-item { padding:6px; border-bottom:1px solid rgba(255,255,255,0.03); display:flex; gap:8px; align-items:center; }
    textarea#paraText { width:100%; height:80px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar" style="display:flex;align-items:center;gap:12px;">
      <h1>Editor (local)</h1>
      <div class="top-controls">
        <label style="display:flex;align-items:center;gap:6px;">
          🔊
          <input id="masterVolume" type="range" min="0" max="100" value="100" />
        </label>
        <button id="btn-undo" title="Undo">↶</button>
        <button id="btn-clean" title="Clean canvas">🧹</button>
      </div>
    </div>

    <div class="row" style="height:calc(100vh - 72px);">
      <div class="leftpanel" style="width:360px;padding:8px;box-sizing:border-box;">
        <div class="left-tabs" style="display:flex;gap:8px;margin-bottom:12px;">
          <button class="tab-btn active" data-tab="tools" title="Herramienta">🖌️</button>
          <button class="tab-btn" data-tab="images" title="Imágenes/GIFs">🖼️</button>
          <button class="tab-btn" data-tab="audio" title="Audio">🎵</button>
          <button class="tab-btn" data-tab="paragraphs" title="Párrafos">📝</button>
          <button class="tab-btn" data-tab="control" title="Control">⚙️</button>
        </div>

        <div class="panel tab-panel" id="panel-tools" data-tab="tools">
          <h3>Herramienta</h3>
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <button id="toolBrush">Brush</button>
            <button id="toolSelect">Select</button>
          </div>
          <div style="margin-top:8px">
            <label>Color: <input id="brushColor" type="color" value="#ff0000"></label>
            <label style="margin-left:8px">Grosor: <input id="brushSize" type="range" min="1" max="60" value="6"></label>
            <div style="margin-top:8px"><button id="btn-clear-local">Limpiar trazos locales</button></div>
          </div>
        </div>

        <div class="panel tab-panel" id="panel-images" data-tab="images" style="display:none">
          <h3>Biblioteca — Imágenes / GIFs</h3>
          <input id="imgFile" type="file" accept="image/*">
          <button id="btn-upload-img">Subir a biblioteca</button>
          <div id="imagesList" style="margin-top:8px;max-height:56vh;overflow:auto;"></div>
        </div>

        <div class="panel tab-panel" id="panel-audio" data-tab="audio" style="display:none">
          <h3>Biblioteca — Audio</h3>
          <input id="audioFile" type="file" accept="audio/*">
          <button id="btn-upload-audio">Subir a biblioteca</button>
          <div id="audioList" style="margin-top:8px;max-height:56vh;overflow:auto;"></div>
        </div>

        <div class="panel tab-panel" id="panel-paragraphs" data-tab="paragraphs" style="display:none">
          <h3>Biblioteca — Párrafos</h3>
          <label>Texto:</label>
          <textarea id="paraText" placeholder="Escribe aquí tu párrafo..."></textarea>
          <div style="display:flex;gap:8px;margin-top:6px;">
            <input id="paraFontSize" type="number" value="20" min="6" style="width:80px"/> <small>px</small>
            <button id="btn-save-para">Agregar a la biblioteca</button>
          </div>
          <div id="paraList" style="margin-top:8px;max-height:36vh;overflow:auto;"></div>
        </div>

        <div class="panel tab-panel" id="panel-control" data-tab="control" style="display:none">
          <h3>Control</h3>
          <button id="btn-push-state">Push state → Viewer (snapshot)</button>
          <button id="btn-fetch-state">Fetch state</button>
          <button id="btn-reset-server">Reset server (dev)</button>
          <div style="margin-top:8px;color:#9aa6b8;font-size:13px">Pan: mantén clic rueda y arrastra • Zoom: rueda</div>
        </div>
      </div>

      <div class="canvaswrap" style="flex:1;display:flex;align-items:stretch;padding:8px;">
        <div class="stage" style="flex:1;position:relative;border:1px solid rgba(255,255,255,0.04);">
          <div id="editorViewport" style="width:100%;height:100%;position:relative;">
            <canvas id="editorCanvas"></canvas>
            <div id="imageLayer" aria-hidden="true"></div>
            <div id="textLayer" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/editor.js"></script>
</body>
</html>
